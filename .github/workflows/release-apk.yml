name: Android CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Read version from build.gradle.kts
        id: ver
        shell: bash
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK version $NAME ($CODE)"

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" release/WMPokeTrap.apk
          printf '{\n  "versionCode": %s,\n  "versionName": "%s"\n}\n' \
            "${{ steps.ver.outputs.version_code }}" \
            "${{ steps.ver.outputs.version_name }}" > release/latest.json
          ls -la release

      - name: Upload build artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: wmpoketrap-${{ steps.ver.outputs.version_name }}
          path: |
            release/WMPokeTrap.apk
            release/latest.json

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WMPokeTrap.apk
            release/latest.json
          body: |
            versionCode=${{ steps.ver.outputs.version_code }}

            WM PokeTrap ${{ steps.ver.outputs.version_name }}

            - Auto-built by GitHub Actions
            - Install over previous build (keeps settings)
            - Setup tab → Check Update / Install Update
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
