name: Android CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Read version from build.gradle.kts
        id: ver
        shell: bash
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK version $NAME ($CODE)"

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release
          # app/build.gradle.kts: layout.buildDirectory = java.io.tmpdir/wmpoketrap-app-build
          JAVA_TMP=$(java -XshowSettings:properties -version 2>&1 | awk -F' = ' '/java\.io\.tmpdir/ {print $2; exit}' | tr -d '\r')
          echo "JAVA_TMP=$JAVA_TMP TMPDIR=${TMPDIR:-} RUNNER_TEMP=${RUNNER_TEMP:-}"
          APK=""
          for root in \
            "$JAVA_TMP/wmpoketrap-app-build" \
            "${TMPDIR:-/tmp}/wmpoketrap-app-build" \
            "${RUNNER_TEMP:-}/wmpoketrap-app-build" \
            "/tmp/wmpoketrap-app-build" \
            "app/build/outputs"
          do
            [ -n "$root" ] || continue
            [ -d "$root" ] || continue
            echo "Searching $root"
            APK=$(find "$root" -name '*.apk' -print -quit || true)
            [ -n "$APK" ] && break
          done
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "APK not found; listing candidate roots:"
            ls -la "$JAVA_TMP" "${TMPDIR:-/tmp}" "${RUNNER_TEMP:-}" /tmp 2>/dev/null || true
            exit 1
          fi
          cp "$APK" release/WMPokeTrap.apk
          printf '{\n  "versionCode": %s,\n  "versionName": "%s"\n}\n' \
            "${{ steps.ver.outputs.version_code }}" \
            "${{ steps.ver.outputs.version_name }}" > release/latest.json
          ls -la release

      - name: Upload build artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: wmpoketrap-${{ steps.ver.outputs.version_name }}
          path: |
            release/WMPokeTrap.apk
            release/latest.json

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WMPokeTrap.apk
            release/latest.json
          body: |
            versionCode=${{ steps.ver.outputs.version_code }}

            WM PokeTrap ${{ steps.ver.outputs.version_name }}

            - Auto-built by GitHub Actions
            - Install over previous build (keeps settings)
            - Setup tab → Check Update / Install Update
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
